name: Maintain

on:
  schedule:
    - cron: '17 3 * * 1,4'
  repository_dispatch:
    types: [ core-push ]
  workflow_dispatch:
    inputs:
      fill:
        description: '根据覆盖率补充测试'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: maintain
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout test
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout core
        uses: actions/checkout@v7
        with:
          repository: AutoTweaker/core
          path: .core
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build core
        id: build
        continue-on-error: true
        run: |
          cd .core
          ./gradlew build

      - name: Export core runtime
        id: export
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          cd .core
          ./gradlew :autotweaker-core:exportRuntime :cli-adapter:exportRuntime

      - name: Run tests
        id: test
        if: steps.export.outcome == 'success'
        continue-on-error: true
        run: |
          ./gradlew test -Pautotweaker.runtime="$PWD/.core/core/build/runtime:$PWD/.core/cli-adapter/build/runtime"

      - name: Decide mode
        id: mode
        if: always()
        run: |
          mode=none
          if [ "${{ steps.test.outcome }}" = "failure" ]; then
            mode=maintain
          elif [ "${{ steps.test.outcome }}" = "success" ]; then
            if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.fill }}" = "true" ]; then
              mode=fill
            fi
          fi
          if [ "${{ steps.build.outcome }}" = "failure" ]; then
            echo "::warning::core 构建失败，本轮跳过"
          elif [ "${{ steps.export.outcome }}" = "failure" ]; then
            echo "::warning::core 产物导出失败，本轮跳过"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "本轮 mode=$mode"

      - name: Prepare workspace
        if: steps.mode.outputs.mode != 'none'
        run: mkdir -p .autotweaker

      - name: Load prompt
        id: prompt
        if: steps.mode.outputs.mode != 'none'
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "maintain" ]; then
            file=.github/workflows/maintain.prompt.md
          else
            file=.github/workflows/fill.prompt.md
          fi
          echo "加载 $file"
          {
            echo 'text<<PROMPT_EOF'
            cat "$file"
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run agent
        id: agent
        if: steps.mode.outputs.mode != 'none'
        uses: AutoTweaker/action@v1
        env:
          GH_TOKEN: ${{ secrets.READ_ONLY_TOKEN }}
        with:
          prompt: ${{ steps.prompt.outputs.text }}
          api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          provider-type: deepseek
          model-id: deepseek-flash
          reasoning: high

      - name: Push commits
        if: steps.mode.outputs.mode != 'none'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [ -z "$(git log origin/main..HEAD --oneline)" ]; then
            echo "工作区没有新提交，跳过推送"
            exit 0
          fi
          git pull --rebase --autostash "$remote" main
          git push "$remote" HEAD:main

      - name: Apply issue action
        if: steps.mode.outputs.mode != 'none'
        env:
          GH_TOKEN: ${{ secrets.ISSUE_TOKEN }}
        run: |
          json=.autotweaker/issue.json
          md=.autotweaker/issue.md
          if [ ! -f "$json" ] && [ ! -f "$md" ]; then
            echo "没有 issue 操作"
            exit 0
          fi
          if [ ! -f "$json" ] || [ ! -f "$md" ]; then
            echo "issue 文件不完整，.autotweaker/ 下只有：$(ls .autotweaker/)" >&2
            exit 1
          fi
          {
            cat "$md"
            printf '\n\n---\n\n'
            echo "> 以上内容由 AutoTweaker Agent 生成，参见 [运行记录](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})。"
          } > .autotweaker/body.md
          action=$(jq -r '.action' "$json")
          case "$action" in
            create)
              gh issue create --repo AutoTweaker/core \
                --title "$(jq -r '.title' "$json")" \
                --body-file .autotweaker/body.md
              ;;
            comment)
              gh issue comment "$(jq -r '.issue' "$json")" \
                --repo AutoTweaker/core \
                --body-file .autotweaker/body.md
              ;;
            *)
              echo "未知的 action: $action" >&2
              exit 1
              ;;
          esac

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore
          retention-days: 14
